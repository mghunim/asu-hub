<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A8FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ASU HUB">
<meta name="description" content="ASU HUB — قرية أعضاء هيئة التدريس جامعة عين شمس">
<title>ASU HUB</title>
<meta property="og:title" content="ASU HUB — قرية أعضاء هيئة التدريس جامعة عين شمس">
<meta property="og:description" content="تطبيق قرية أعضاء هيئة التدريس — جامعة عين شمس، الساحل الشمالي ك 72">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Cairo:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one phone-width app column (max 440px) centered; fixed top bar, scrolling body, bottom tab bar. */
/* ASU HUB palette (from the village logo): sun #F6B21A, sand #FCE6A8, sea #1A8FD6, deep sea #0B3554 */
:root{
  --bg:#FFFAF0; --page:#FCE6A8; --field:#FDF1D3; --card:#FFFFFF; --line:#F1E0B3;
  --ink:#0B3554; --muted:#5E6B78; --teal:#1A8FD6; --teal-soft:#CDE8F8; --on-teal:#ffffff;
  --coral:#F2A20C; --amber:#E08A00; --red:#E0574A; --green:#2E8B5E; --navy:#0B3554; --sand:#FCE6A8;
  --shadow:0 8px 24px rgba(11,53,84,.12);
  --font:"Nunito","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"Cairo","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08223A; --page:#041626; --field:#123352; --card:#0E2C47; --line:#1D4566;
  --ink:#F4EEDC; --muted:#9FB0BF; --teal:#3BA7EA; --teal-soft:#123E5E; --on-teal:#ffffff;
  --coral:#F6B53A; --amber:#F2A93B; --red:#F07466; --green:#4DB282; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08223A; --page:#041626; --field:#123352; --card:#0E2C47; --line:#1D4566;
  --ink:#F4EEDC; --muted:#9FB0BF; --teal:#3BA7EA; --teal-soft:#123E5E; --on-teal:#ffffff;
  --coral:#F6B53A; --amber:#F2A93B; --red:#F07466; --green:#4DB282; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;overflow:clip}
@media (min-width:480px){.app{box-shadow:var(--shadow);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px 12px 6px;min-height:56px}
.top h1{margin:0;text-align:center;font-size:19px;font-weight:800;text-wrap:balance}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink);position:relative}
.iconbtn:active{background:var(--field)}
.cnt{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font-size:11.5px;font-weight:800;line-height:19px;text-align:center;border:2px solid var(--bg);box-sizing:content-box}
.seg .cnt{position:static;display:inline-block;margin-inline-start:6px;border:0;vertical-align:1px}
.tab .cnt{top:-2px;right:calc(50% - 26px)}
[dir=rtl] .cnt{right:auto;left:-3px}[dir=rtl] .seg .cnt{left:auto}[dir=rtl] .tab .cnt{left:calc(50% - 26px);right:auto}
.iconbtn{position:relative}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid var(--bg)}
.hubmark{width:96px;height:96px;border-radius:28px;background:#FFFFFF;box-shadow:0 4px 14px rgba(11,53,84,.12);display:grid;place-items:center;flex:none}
.hubmark svg{width:86%;height:86%}
.hubmark img{width:94%;height:94%;object-fit:contain;display:block}
.hubmark.sm{width:64px;height:64px;border-radius:20px}
.hubmark.xs{width:34px;height:34px;border-radius:10px}
.word{font-weight:900;letter-spacing:.14em}
.btn.cta{background:var(--coral);box-shadow:0 0 0 5px color-mix(in srgb,var(--coral) 25%,transparent)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 24px;-webkit-overflow-scrolling:touch}
.tabs{flex:none;display:flex;justify-content:space-around;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 16px;border-radius:999px;min-width:72px}
.tab.on{color:var(--ink);background:var(--field)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* type + basics */
.h-hi{font-size:26px;font-weight:900;margin:2px 0 0}
.sub{color:var(--muted);font-weight:600;font-size:13.5px}
.unitline{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;color:var(--ink)}
.unitline svg{width:16px;height:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{margin:0;font-size:16px;font-weight:800}
.link{color:var(--teal);font-weight:800;font-size:13.5px}
.lead{text-align:center;font-weight:700;font-size:17px;line-height:1.35;margin:6px auto 26px;max-width:28ch;text-wrap:balance}
.ar{font-family:var(--ar);direction:rtl}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.02em;padding-left:4px}
.in,.sel select,textarea.in{width:100%;border:1.5px solid transparent;background:var(--field);border-radius:18px;padding:17px 20px;font-weight:700;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.in::placeholder,textarea.in::placeholder{color:var(--muted);opacity:.75}
.in:focus,.sel select:focus{border-color:var(--teal)}
.sel{position:relative}
.sel select{padding-right:48px}
.sel select:invalid{color:var(--muted)}
.sel svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none}
textarea.in{min-height:110px;resize:vertical;line-height:1.45}
.seg{display:flex;background:var(--field);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 8px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.err{color:var(--red);font-weight:700;font-size:13px;min-height:18px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 18px;border-radius:18px;font-weight:900;font-size:16.5px;background:var(--teal);color:var(--on-teal);box-shadow:0 0 0 5px var(--teal-soft)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--field);color:var(--ink);box-shadow:none}
.btn.small{width:auto;padding:10px 16px;font-size:14px;border-radius:14px;box-shadow:none}
.btn.danger{background:transparent;color:var(--red);box-shadow:none;border:1.5px solid var(--line)}
.foot{flex:none;padding:12px 22px calc(18px + env(safe-area-inset-bottom,0px))}

/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.qa{background:var(--card);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-weight:800;font-size:13px;text-align:left}
.qa .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.qa .ic svg{width:18px;height:18px}
.tile{background:var(--card);border-radius:18px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:150px;justify-content:center}
.tile .art{width:62px;height:62px;border-radius:18px;display:grid;place-items:center}
.tile .art svg{width:32px;height:32px;stroke-width:1.6}
.tile b{font-size:13.5px;line-height:1.25}
.tile .ar{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.4}
.hero{background:var(--card);border-radius:22px;padding:22px;margin-top:16px;display:flex;align-items:center;gap:16px}
.post{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.post .who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-weight:900;color:var(--ink);flex:none;font-size:14px;border:1.5px solid var(--line)}
.avatar.lg{width:64px;height:64px;font-size:22px}
.post p{margin:0;line-height:1.6;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.row .t span{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-top:2px}
.pill{font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.p-open{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.p-prog{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
.p-closed{background:var(--field);color:var(--muted)}
.p-ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.p-bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--amber) 14%,var(--bg));border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:16px;padding:12px 14px;font-size:13.5px;font-weight:700;margin-top:12px;line-height:1.4}
.banner svg{color:var(--amber);width:20px;height:20px}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:38px 10px;line-height:1.5}
.empty svg{width:40px;height:40px;margin:0 auto 8px;display:block;opacity:.6}
.unitchip{display:flex;justify-content:center;margin:2px 0 14px}
.unitchip .unitline{color:var(--muted);font-size:13px}

/* welcome */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 26px;text-align:center;gap:10px}
.mark{width:96px;height:96px;border-radius:30px;background:var(--ink);display:grid;place-items:center;margin-bottom:12px}
.mark svg{width:54px;height:54px;color:var(--teal);stroke-width:2}
.welcome h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.01em}
.welcome p{color:var(--muted);font-weight:600;max-width:30ch;line-height:1.5;margin:0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:15px;border-radius:18px;background:var(--bg);border:1.5px solid var(--line);font-weight:800;font-size:16px;color:var(--ink)}
.gbtn svg{width:22px;height:22px}
.steps{display:flex;gap:6px;justify-content:center;margin:0 0 6px}
.steps i{width:26px;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--teal)}
.note{font-size:12px;color:var(--muted);font-weight:600;line-height:1.45;text-align:center;margin-top:12px}

/* drawer + sheet */
.scrim{position:absolute;inset:0;background:rgba(8,14,28,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:330px;background:var(--bg);z-index:21;transform:translateX(-102%);transition:transform .24s ease;display:flex;flex-direction:column;padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none;visibility:visible;transition:transform .24s ease}
.drawer{visibility:hidden;transition:transform .24s ease,visibility 0s .24s}
.drawer .me{display:flex;gap:12px;align-items:center;padding:8px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%}
.drawer nav{flex:1;overflow-y:auto}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border-radius:12px;font-weight:700;font-size:15px;text-align:left}
.mi:active,.mi:hover{background:var(--field)}
.mi svg{color:var(--muted)}
.mi.mgr{color:var(--teal)} .mi.mgr svg{color:var(--teal)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);z-index:31;border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .26s ease;display:flex;flex-direction:column}
.sheet.on{transform:none;visibility:visible;transition:transform .26s ease}
.sheet{visibility:hidden;transition:transform .26s ease,visibility 0s .26s}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet .sh{padding:6px 20px 0;flex:none}
.sheet .sh h3{margin:6px 0 4px;font-size:19px;font-weight:900}
.sheet .sb{padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#scrim2{z-index:30}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.2s;z-index:40;pointer-events:none;width:max-content;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* badge / pass */
.badge{border-radius:24px;background:var(--ink);color:var(--bg);padding:22px;display:flex;flex-direction:column;gap:16px}
.badge .qr{background:#fff;border-radius:16px;padding:14px;align-self:center;width:max-content}
.badge .qr img,.badge .qr canvas{display:block}
.badge small{opacity:.7;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.badge .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge .kv b{display:block;font-size:15px}
.acc{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc summary{list-style:none;padding:15px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc[open] summary svg{transform:rotate(180deg)}
.acc ol,.acc ul,.acc p{margin:0;padding:0 18px 16px 34px;line-height:1.6;font-size:14px;color:var(--ink)}
.acc p{padding-left:16px}
.statbtn{border:0;font:inherit;color:inherit;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent}.statbtn:active{transform:scale(.97)}
.stat{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--muted)}
.offer{min-width:240px;background:var(--card);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.offer .pct{font-size:24px;font-weight:900;color:var(--coral);line-height:1}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.example{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--field);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}
.sel-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* language + RTL */
[lang=ar] body{font-family:var(--ar)}
.langsw{display:inline-flex;background:var(--field);border-radius:999px;padding:4px;gap:4px}
.langsw button{padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted)}
.langsw button.on{background:var(--ink);color:var(--bg)}
.wa{display:flex;align-items:center;gap:12px;background:#E7F7EE;color:#0F6B3A;border:1.5px solid #BFE8D0;border-radius:16px;padding:12px 14px;text-decoration:none;width:100%}
.wa svg{color:#1E9E57;width:26px;height:26px}
.wa span{flex:1;min-width:0}.wa b{display:block;font-size:15px}.wa small{font-size:12.5px;font-weight:700;opacity:.85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{background:#0F2F22;color:#9BE3BD;border-color:#1F5A3E}}
:root[data-theme="dark"] .wa{background:#0F2F22;color:#9BE3BD;border-color:#1F5A3E}
.wa.fb{background:#E8F0FE;color:#0B4FB3;border-color:#C6D8FA}.wa.fb svg{color:#1877F2}
.scanbox{position:relative;width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;background:#0B1A2A;margin-bottom:14px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16%;border:4px solid #fff;border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.scanidle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:8px;padding:20px;font-weight:700}
.scanidle svg{width:46px;height:46px}
.verdict{border-radius:22px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;margin-bottom:14px;text-align:center}
.verdict.ok{background:#1E9E57}.verdict.no{background:#D64545}.verdict svg{width:60px;height:60px;stroke-width:3}.verdict b{font-size:25px}.verdict span{font-weight:700}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv2 small{display:block;color:var(--muted);font-size:12px;font-weight:700}.kv2 b{font-size:15px}
.flagcard{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:color-mix(in srgb,var(--fc) 13%,var(--card,#fff));border:1.5px solid color-mix(in srgb,var(--fc) 45%,transparent);border-radius:16px;padding:10px 12px;margin:0 0 14px}
.flagcard .t{display:flex;flex-direction:column;min-width:0}.flagcard b{font-size:15px}.flagcard small{font-weight:700;color:var(--muted);font-size:12px}.flagcard .t>span{font-size:13px;font-weight:700;color:var(--fc)}
.flagico{width:38px;height:38px;border-radius:11px;background:var(--fc);color:#fff;display:grid;place-items:center;flex:none}.flagico svg{width:22px;height:22px}
.flagpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.flagpick button{color:#fff;border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;opacity:.8;border:3px solid transparent}
.flagpick button.on{opacity:1;border-color:var(--ink)}.flagpick b{font-size:14px}.flagpick span{font-size:11px;line-height:1.35}.flagpick svg{width:24px;height:24px}
[dir=rtl] svg.flip{transform:scaleX(-1)}
[dir=rtl] .sel svg{right:auto;left:18px}
[dir=rtl] .sel select{padding-right:20px;padding-left:48px}
[dir=rtl] .drawer{left:auto;right:0;transform:translateX(102%)}
[dir=rtl] .drawer.on{transform:none}
[dir=rtl] .row,[dir=rtl] .qa,[dir=rtl] .mi,[dir=rtl] .me{text-align:right}
[dir=rtl] .dot{right:auto;left:10px}
[dir=rtl] .acc ol,[dir=rtl] .acc ul{padding:0 34px 16px 18px}
[dir=rtl] .field label{padding-left:0;padding-right:4px}
[dir=rtl] .example{margin-left:0;margin-right:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="screen" style="display:flex;flex-direction:column;flex:1;min-height:0;padding-top:env(safe-area-inset-top,0px)"></div>
  <div class="scrim" id="scrim"></div>

const D={session:null,profile:null,communities:[],units:[],updates:[],requests:[],complaints:[],passes:[],notes:[],violations:[],notifs:[],m:{units:[],requests:[],complaints:[]}};
const isMgr=()=>D.profile?.role==="manager";
const isSec=()=>D.profile?.role==="security";
const unit=()=>D.units.find(u=>u.id===lsGet("asu-active"))||D.units.find(u=>u.status!=="rejected")||D.units[0];

async function load(){
  const id=D.session.user.id;
  const [profile,communities,units,updates,requests,complaints,passes,notes,violations,notifs]=await Promise.all([
    q(sb.from("profiles").select("*").eq("id",id).single()),
    q(sb.from("communities").select("*").eq("slug",VILLAGE_SLUG)),
    q(sb.from("units").select("*, communities(name,district), unit_documents(id,kind,path)").eq("user_id",id).order("created_at")),
    q(sb.from("updates").select("*, communities(name)").order("created_at",{ascending:false}).limit(60)),
    q(sb.from("requests").select("*, units(unit_no)").eq("user_id",id).order("created_at",{ascending:false})),
    q(sb.from("complaints").select("*, units(unit_no)").eq("user_id",id).order("created_at",{ascending:false})),
    q(sb.from("gate_passes").select("*, units(unit_no, communities(name))").eq("user_id",id).order("created_at",{ascending:false})),
    q(sb.from("gate_notes").select("*").eq("user_id",id).order("created_at",{ascending:false}).limit(30)),
    q(sb.from("violations").select("*, units(unit_no,user_id)").order("created_at",{ascending:false})),
    q(sb.from("notifications").select("*").eq("user_id",id).order("created_at",{ascending:false}).limit(60)),
  ]);
  const cid=communities[0]?.id;
  D.vunits=cid?await q(sb.from("village_units").select("id,code").eq("community_id",cid)):[];
  D.vunits.sort((a,b)=>a.code.localeCompare(b.code,"en",{numeric:true}));
  const myU=units.filter(u=>u.community_id===cid);const uids=new Set(myU.map(u=>u.id));
  Object.assign(D,{profile,communities,units:myU,updates:updates.filter(x=>x.community_id===cid),requests:requests.filter(r=>uids.has(r.unit_id)),complaints:complaints.filter(c=>uids.has(c.unit_id)),passes:passes.filter(p=>uids.has(p.unit_id)),notes:notes.filter(n=>uids.has(n.unit_id)),notifs,violations:violations.filter(v=>v.units?.user_id===id&&uids.has(v.unit_id))});
  if(profile.lang&&!lsGet("asu-lang")&&profile.lang!==LANG){LANG=profile.lang;applyLang()}
  D.flag=null;if(cid)try{D.flag=(await q(sb.from("beach_flags").select("*").eq("community_id",cid).order("flag_date",{ascending:false}).limit(1)))[0]||null}catch(e){}
  D.balances=[];const ownV=myU.filter(isOwnerU).map(u=>u.village_unit_id).filter(Boolean);if(ownV.length)try{D.balances=await q(sb.from("chalet_balances").select("*").in("village_unit_id",ownV))}catch(e){}
  D.payments=[];if(profile.role==="resident"&&myU.some(isOwnerU))try{D.payments=await q(sb.from("balance_payments").select("*, units(unit_no)").order("created_at",{ascending:false}))}catch(e){}
  D.rentals=[];if(profile.role==="resident"&&myU.some(isOwnerU))try{D.rentals=await q(sb.from("rentals").select("*, units(unit_no)").order("created_at",{ascending:false}))}catch(e){}
  D.invites=[];D.family=[];
  if(profile.role==="resident"){try{D.invites=(await q(sb.rpc("my_family_invites"))).filter(x=>x.community_id===cid)}catch(e){}
   if(myU.some(isOwnerU))try{D.family=await q(sb.from("family_invites").select("*, acc:units!family_invites_accepted_unit_fkey(status)").order("created_at"))}catch(e){}}
  if(isMgr())await loadMgr();
  if(isSec())D.scans=await q(sb.from("gate_scans").select("*").order("created_at",{ascending:false}).limit(20));
}
async function loadMgr(){
  const [units,requests,complaints]=await Promise.all([
    q(sb.from("units").select("*, profiles(full_name,phone,relation,email,national_id), communities(name,district), unit_documents(id,kind,path), village_units(code, village_unit_owners(owner_name))").order("created_at",{ascending:false})),
    q(sb.from("requests").select("*, units(unit_no, communities(name)), profiles(full_name,phone)").order("created_at",{ascending:false}).limit(400)),
    q(sb.from("complaints").select("*, units(unit_no, communities(name)), profiles(full_name,phone)").order("created_at",{ascending:false}).limit(400)),
  ]);
  const cid=D.communities[0]?.id;const ids=new Set(units.filter(u=>u.community_id===cid).map(u=>u.id));
  try{D.mpay=await q(sb.from("balance_payments").select("*, units(unit_no), profiles(full_name,phone)").order("created_at",{ascending:false}).limit(200))}catch(e){D.mpay=[]}
  try{D.mrent=await q(sb.from("rentals").select("*, units(unit_no), profiles(full_name,phone)").order("created_at",{ascending:false}).limit(200))}catch(e){D.mrent=[]}
  try{D.mfb=await q(sb.from("item_feedback").select("*").order("created_at",{ascending:false}).limit(1000))}catch(e){D.mfb=[]}
  try{D.mgrs=await q(sb.rpc("list_managers"))}catch(e){D.mgrs=[]}
  try{D.secs=await q(sb.rpc("list_security"))}catch(e){D.secs=[]}
  const ccid=D.communities[0]?.id;D.chalets=ccid?await q(sb.from("village_units").select("id,code,village_unit_owners(owner_name),chalet_balances(amount,note,updated_at)").eq("community_id",ccid)):[];
  D.chalets.sort((a,b)=>a.code.localeCompare(b.code,"en",{numeric:true}));
  D.m={units:units.filter(u=>u.community_id===cid),requests:requests.filter(r=>ids.has(r.unit_id)),complaints:complaints.filter(c=>ids.has(c.unit_id))};

async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{const img=await createImageBitmap(file);const m=2000,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));return b&&b.size<file.size?new File([b],"doc.jpg",{type:"image/jpeg"}):file}catch(e){return file}}
async function uploadDoc(input){
  const file=input.files[0];if(!file)return;const kind=input.dataset.doc,unitId=input.dataset.unit;
  const lbl=input.closest("label");if(lbl)lbl.firstChild.textContent=t("Uploading…");
  try{const f=await shrink(file);if(f.size>10485760){toast(t("File is larger than 10 MB"));return render()}
    const ext=(f.type==="application/pdf"?"pdf":(f.name.split(".").pop()||"jpg")).toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
    const path=`${D.profile.id}/${unitId}/${kind}-${Date.now()}.${ext}`;
    const up=await sb.storage.from("unit-docs").upload(path,f,{contentType:f.type||"application/octet-stream",upsert:false});if(up.error)throw up.error;
    const old=D.units.find(u=>u.id===unitId)?.unit_documents?.filter(d=>d.kind===kind)||[];
    await q(sb.from("unit_documents").insert({unit_id:unitId,kind,path}));
    for(const o of old){await sb.from("unit_documents").delete().eq("id",o.id);await sb.storage.from("unit-docs").remove([o.path])}
    await load();render();toast(t("Uploaded"))}catch(e){toast(e.message||t("Something went wrong"));render()}}
const isVid=p=>/\.(mp4|mov|webm|3gp|m4v)$/i.test(p||"");
async function upMedia(file,folder="media"){const f=await shrink(file);if(f.size>52428800)throw new Error(t("File is larger than 50 MB"));
 const ext=(f.type==="application/pdf"?"pdf":/^video\//.test(f.type)?(f.name.split(".").pop()||"mp4"):(f.name.split(".").pop()||"jpg")).toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";

async function startCam(){
 try{await loadJsQR();camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  tmp.camOn=true;tmp.scanRes=null;render();const v=document.getElementById("scv");v.srcObject=camStream;await v.play();
  const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
  const tick=()=>{if(!camStream)return;if(v.readyState>=2&&v.videoWidth){const sc=Math.min(1,640/v.videoWidth);c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);x.drawImage(v,0,0,c.width,c.height);
    const img=x.getImageData(0,0,c.width,c.height);const code=jsQR(img.data,c.width,c.height,{inversionAttempts:"dontInvert"});if(code&&code.data){stopCam(true);checkCode(code.data);return}}
   camTimer=requestAnimationFrame(tick)};tick()}
 catch(e){stopCam(true);tmp.camOn=false;render();toast(t("Camera not available. Allow camera access in your browser settings."))}}
function stopCam(silent){if(camTimer)cancelAnimationFrame(camTimer);camTimer=null;if(camStream){camStream.getTracks().forEach(k=>k.stop());camStream=null}tmp.camOn=false;if(!silent)render()}

function permitsHTML(){const pt=["New","Approved","Rejected","Deleted"].includes(tmp.prtab)?tmp.prtab:"New";
 const all=D.m.requests.filter(r=>r.kind!=="service");const keep=r=>pt==="Deleted"?!!r.deleted_at:!r.deleted_at&&(pt==="New"?["Open","In progress"].includes(r.status):pt==="Approved"?["Approved","Closed"].includes(r.status):r.status==="Rejected");
 const rows=all.filter(keep).map(r=>`<div class="row" style="flex-wrap:wrap"><div class="t"><b>${esc(typeName(typeOf(r.type)))}</b><span>${t("Unit {u}",{u:esc(r.units?.unit_no)})} · ${esc(r.profiles?.full_name||"")} · <bdi>${esc(r.profiles?.phone||"")}</bdi></span>${r.details?`<span dir="auto" style="white-space:pre-line">${esc(r.details)}</span>`:""}${r.media_path?`<span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${mediaBtns(r.media_path,r.type==="workers"?"ID":"Attachment")}</span>`:""}<span>${fmtDate(r.created_at)}</span>${r.status==="Rejected"&&r.manager_note?`<span style="color:var(--red);font-weight:800" dir="auto">${t("Reason")}: ${esc(r.manager_note)}</span>`:""}${r.deleted_at?`<span>${t("Deleted on {d}",{d:fmtDate(r.deleted_at)})}</span>`:""}</div>${pill(r.status==="Open"?"pending":r.status)}
  <div class="sel-row" style="width:100%">${r.deleted_at?"":`${["Approved","Closed"].includes(r.status)?"":`<button class="btn small" data-a="setPermit" data-v="${r.id}" data-s="Approved">${I("check")}${t("Approve")}</button>`}${r.status==="Rejected"?"":`<button class="btn small ghost" data-a="askReject" data-v="${r.id}">${t("Reject")}</button>`}`}${delBtn("requests",r)}</div></div>`).join("");
 return segs("prtab",["New","Approved","Rejected","Deleted"],{New:mgrCounts().Requests})+'<div style="height:12px"></div>'+(rows||empty(pt==="Deleted"?"trash":"clip",pt==="New"?t("No requests waiting for a decision."):pt==="Deleted"?t("No deleted items."):t("Nothing here yet.")))}
function ratingsHTML(){const NN=n=>LANG==="ar"?arNum(n):n;
 const items=Object.fromEntries([...D.m.requests.map(r=>[r.id,{...r,_k:"requests"}]),...D.m.complaints.map(c=>[c.id,{...c,_k:"complaints"}])]);
 const fb=(D.mfb||[]).filter(f=>items[f.item_id]);if(!fb.length)return empty("star",t("No ratings yet. Owners can rate a request after it is closed."));
 const avg=x=>(x.reduce((a,f)=>a+f.rating,0)/x.length).toFixed(1);const first={};[...fb].reverse().forEach(f=>{if(!first[f.item_id])first[f.item_id]=f});const fi=Object.values(first);
 const pct=x=>Math.round(100*x.filter(f=>f.solved==="yes").length/x.length);
 const groups={};fb.forEach(f=>{const k=itemTitle(items[f.item_id]);(groups[k]=groups[k]||[]).push(f)});
 const byType=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([k,l])=>{const fl=Object.values(Object.fromEntries([...l].reverse().map(f=>[f.item_id,f])));
  return `<div class="row"><div class="t"><b>${esc(k)}</b><span>${t("{n} ratings",{n:l.length})} — ${t("Solved first time")}: ${NN(pct(fl.length?[...l].reverse().filter((f,i,a)=>a.findIndex(x=>x.item_id===f.item_id)===i):l))}%</span></div><b style="font-size:18px;white-space:nowrap">${NN(avg(l))} <span style="color:#E8A33D">★</span></b></div>`}).join("");
 const latest=fb.slice(0,40).map(f=>{const r=items[f.item_id];return `<div class="row" style="flex-wrap:wrap"><div class="t"><b>${esc(itemTitle(r))}</b><span>${t("Unit {u}",{u:esc(r.units?.unit_no)})} · ${esc(r.profiles?.full_name||"")} · <bdi>${esc(r.profiles?.phone||"")}</bdi></span><span style="font-weight:800;color:${f.solved==="no"?"var(--red)":f.solved==="partial"?"var(--coral)":"var(--teal)"}">${STARS(f.rating)} — ${t(SOLVED[f.solved])}</span>${f.note?`<span dir="auto">«${esc(f.note)}»</span>`:""}${f.media_path?`<span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${mediaBtns(f.media_path)}</span>`:""}<span>${fmtDate(f.created_at)}</span></div></div>`}).join("");
 return `<div class="grid3" style="margin:0 0 16px"><div class="stat"><b>${NN(avg(fb))} <span style="color:#E8A33D">★</span></b><span>${t("Average rating")}</span></div><div class="stat"><b>${NN(pct(fi))}%</b><span>${t("Solved first time")}</span></div><div class="stat"><b>${NN(fb.length)}</b><span>${t("Ratings received")}</span></div></div>
 <div class="sec"><h2>${t("By type")}</h2></div>${byType}<div class="sec"><h2>${t("Latest ratings")}</h2></div>${latest}`}
V.manager=()=>{if(!isMgr())return V.home();
 const pend=D.m.units.filter(u=>u.status==="pending");const tb=tmp.mtab||"Approvals";let inner="";
 if(tb==="Approvals"){
  const prent=(D.mrent||[]).filter(r=>r.status==="pending"),drent=(D.mrent||[]).filter(r=>r.status!=="pending").slice(0,10);
  const rentHTML=`<div class="sec"><h2>${t("Rental requests")}</h2></div>${prent.map(r=>rentRow(r,true)).join("")||`<p class="sub">${t("No rental requests waiting.")}</p>`}${drent.length?`<details style="margin:6px 0 14px"><summary class="link">${t("Recent rentals")}</summary>${drent.map(r=>rentRow(r,true)).join("")}</details>`:""}<div class="sec" id="pendres"><h2>${t("Residents waiting for approval")}</h2></div>`;
  const ppay=(D.mpay||[]).filter(r=>r.status==="pending"),dpay=(D.mpay||[]).filter(r=>r.status!=="pending").slice(0,10);

 askDelItem(el){sheet(t("Delete this item?"),`<p style="line-height:1.5;margin:0 0 16px">${t("It moves to the Deleted tab. You can restore it from there.")}</p><button class="btn" style="background:var(--red);box-shadow:none" data-a="delItem" data-k="${el.dataset.k}" data-v="${el.dataset.v}">${t("Delete")}</button><div style="height:10px"></div><button class="btn ghost" data-a="closeSheet">${t("Cancel")}</button>`)},
 delItem:el=>busy(el,async()=>{const {error}=await sb.rpc("set_item_deleted",{p_kind:el.dataset.k,p_id:el.dataset.v,p_deleted:true});if(error)throw error;closeSheet();await refresh();toast(t("Moved to Deleted"))}),
 restoreItem:el=>busy(el,async()=>{const {error}=await sb.rpc("set_item_deleted",{p_kind:el.dataset.k,p_id:el.dataset.v,p_deleted:false});if(error)throw error;await refresh();toast(t("Restored"))}),
 setStatus:el=>busy(el,async()=>{await q(sb.from(el.dataset.k).update({status:el.dataset.s}).eq("id",el.dataset.v));await refresh();toast(t("Marked {s}",{s:t(el.dataset.s)}))}),
 publish:el=>busy(el,async()=>{const c=val("m-pc"),tx=val("m-post"),f=document.getElementById("m-pf")?.files?.[0];if(!c)return toast(t("Choose the community"));if(!tx&&!f)return toast(t("Write the announcement or attach a file"));
   let row={community_id:c,body:tx||""};
   if(f){if(f.size>15*1024*1024)return toast(t("File is larger than 15 MB"));const ext=(f.name.split(".").pop()||"pdf").toLowerCase().replace(/[^a-z0-9]/g,"");const path=`${c}/${Date.now()}.${ext}`;
    const {error}=await sb.storage.from("news-files").upload(path,f,{contentType:f.type||"application/pdf"});if(error)throw error;row.file_path=path;row.file_name=f.name}
   await q(sb.from("updates").insert(row));await refresh();toast(t("Update published"))}),
 flagInfo(){const f=D.flag;if(!f)return;sheet(t("Beach flag"),`${Object.entries(FLAG).map(([k,F])=>`<div class="row" style="${k===f.color?`box-shadow:inset 0 0 0 2px ${F.c}`:"opacity:.75"}"><span class="flagico" style="--fc:${F.c}">${I("flag")}</span><div class="t"><b>${t(F.n)}${k===f.color?` — ${fmtDate(f.flag_date)}`:""}</b><span style="line-height:1.6">${t(F.l)}</span></div></div>`).join("")}<button class="btn ghost" data-a="closeSheet" style="margin-top:6px">${t("Close")}</button>`)},
 setFlag:el=>busy(el,async()=>{const cid=D.communities[0]?.id;if(!cid)return;const {error}=await sb.from("beach_flags").upsert({community_id:cid,color:el.dataset.v,flag_date:cairoToday()},{onConflict:"community_id,flag_date"});if(error)throw error;await refresh();toast(t("Beach flag announced"))}),
 viewRentDoc(el){openDoc(el.dataset.v,"unit-docs",t("Document"))},
 addRental:el=>busy(el,async()=>{const uid=val("rt-u"),n=val("rt-n"),ph=val("rt-p").replace(/[\s-]/g,""),sd=val("rt-s"),ed=val("rt-e"),fi=document.getElementById("rt-id").files[0],fc=document.getElementById("rt-ct").files[0];
   const nid=val("rt-nid").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,""),pp=parseInt(val("rt-pp"),10);
   if(!n)return err(t("Enter the tenant's full name."));if(!/^[23]\d{13}$/.test(nid))return err(t("Enter the tenant's 14-digit national ID number."));if(!(pp>=1&&pp<=30))return err(t("Enter the number of family members renting."));if(ph&&!/^(\+?20|0020)?0?1[0125]\d{8}$/.test(ph))return err(t("Enter an Egyptian mobile number, e.g. 01012345678."));
   if(!sd||!ed)return err(t("Choose the rental dates."));if(ed<sd)return err(t("The end date must be after the start date."));
   if(!fi||!fc)return err(t("Upload the tenant's ID and the rental contract."));
   const up=async(file,kind)=>{const f=await shrink(file);if(f.size>10485760)throw new Error(t("File is larger than 10 MB"));const ext=(f.type==="application/pdf"?"pdf":(f.name.split(".").pop()||"jpg")).toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
     const path=`${D.profile.id}/rentals/${kind}-${Date.now()}.${ext}`;const r=await sb.storage.from("unit-docs").upload(path,f,{contentType:f.type||"application/octet-stream"});if(r.error)throw r.error;return path};
   const id_path=await up(fi,"tenant_id"),contract_path=await up(fc,"rental_contract");const extra_ids=await Promise.all([...(document.getElementById("rt-ex")?.files||[])].map(f=>up(f,"family_id")));
   const {error}=await sb.from("rentals").insert({unit_id:uid,tenant_name:n,tenant_phone:ph||null,start_date:sd,end_date:ed,id_path,contract_path,tenant_nid:nid,people:pp,extra_ids});if(error)throw error;
   await load();render();toast(t("Rental submitted. The management will review it."))}),
 delRental:el=>busy(el,async()=>{const r=(D.rentals||[]).find(x=>x.id===el.dataset.v);const {error}=await sb.from("rentals").delete().eq("id",el.dataset.v);if(error)throw error;if(r)try{await sb.storage.from("unit-docs").remove([r.id_path,r.contract_path])}catch(e){}await load();render();toast(t("Removed"))}),
 setRental:el=>busy(el,async()=>{const {error}=await sb.from("rentals").update({status:el.dataset.s}).eq("id",el.dataset.v);if(error)throw error;await refresh();toast(el.dataset.s==="approved"?t("Rental approved"):t("Rental rejected"))}),
 copyAcc(el){try{navigator.clipboard.writeText(el.dataset.v);toast(t("Copied"))}catch(e){toast(el.dataset.v)}},
 addPayment:el=>busy(el,async()=>{const uid=val("py-u"),a=val("py-a").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[,\s]/g,""),f=document.getElementById("py-f")?.files?.[0];
   if(!f)return err(t("Upload the payment receipt."));if(a&&!isFinite(Number(a)))return err(t("Enter the amount as a number."));
   const receipt_path=await upMedia(f,"payments");const {error}=await sb.from("balance_payments").insert({unit_id:uid,amount:a?Number(a):null,receipt_path,note:val("py-n")||null});if(error)throw error;
   await load();render();toast(t("Receipt sent. The management will review it."))}),
 delPayment:el=>busy(el,async()=>{const r=(D.payments||[]).find(x=>x.id===el.dataset.v);const {error}=await sb.from("balance_payments").delete().eq("id",el.dataset.v);if(error)throw error;if(r)try{await sb.storage.from("unit-docs").remove([r.receipt_path])}catch(e){}await load();render();toast(t("Removed"))}),
 setPayment:el=>busy(el,async()=>{const {error}=await sb.from("balance_payments").update({status:el.dataset.s}).eq("id",el.dataset.v);if(error)throw error;await refresh();toast(el.dataset.s==="confirmed"?t("Payment confirmed. Update the chalet balance from the Resort tab if needed."):t("Receipt rejected"))}),
 toggleRes(){tmp.showRes=!tmp.showRes;render()},
 viewMedia(el){openDoc(el.dataset.v,"unit-docs",t("Attachment"))},
 goMgr(el){const v=el.dataset.v;if(v==="res")tmp.mtab="Approvals";else if(v==="req"){tmp.mtab="Requests";tmp.prtab="New"}else{tmp.mtab="Services";tmp.rqtab="New"}render();
   setTimeout(()=>{let tg=v==="res"?document.getElementById("pendres"):v==="cmp"?document.querySelector('[data-cmp="1"]'):null;tg=tg||document.querySelector("#screen .hscroll");tg?.scrollIntoView({behavior:"smooth",block:"start"})},60)},
 setPermit:el=>busy(el,async()=>{const {error}=await sb.from("requests").update({status:el.dataset.s,manager_note:null}).eq("id",el.dataset.v);if(error)throw error;closeSheet();await refresh();toast(el.dataset.s==="Approved"?t("Request approved. The owner was notified."):t("Request rejected. The owner was notified."))}),
 askReject(el){sheet(t("Reject this request?"),`<div class="field"><label for="rj-n">${t("Reason (optional — sent to the owner)")}</label><textarea class="in" id="rj-n" dir="auto" maxlength="500"></textarea></div><button class="btn" style="background:var(--red);box-shadow:none" data-a="doReject" data-v="${el.dataset.v}">${t("Reject")}</button><div style="height:10px"></div><button class="btn ghost" data-a="closeSheet">${t("Cancel")}</button>`)},
 doReject:el=>busy(el,async()=>{const {error}=await sb.from("requests").update({status:"Rejected",manager_note:val("rj-n")||null}).eq("id",el.dataset.v);if(error)throw error;closeSheet();await refresh();toast(t("Request rejected. The owner was notified."))}),
 askSchedule(el){const r=D.m.requests.find(x=>x.id===el.dataset.v)||{};const pad=n=>String(n).padStart(2,"0");const ymd=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
   let d=isFuture(r.scheduled_at)?new Date(r.scheduled_at):null;
   if(!d){const hh=/Afternoon/.test(r.preferred_when||"")?14:/Evening/.test(r.preferred_when||"")?18:10;const pd=/^\d{4}-/.test(r.preferred_when||"")?new Date(r.preferred_when.slice(0,10)+"T00:00:00"):new Date();d=new Date(pd);d.setHours(hh,0,0,0);while(d.getTime()<=Date.now())d.setDate(d.getDate()+1)}
   sheet(t("When will the technician come?"),`<p class="sub" style="margin:0 0 12px">${t("The resident is notified with this date and time.")}</p>${r.preferred_when?`<p class="sub" style="margin:0 0 12px">${t("Resident's preference")}: <b>${esc(slotT(r.preferred_when))}</b></p>`:""}
   <div class="sel-row"><div class="field" style="flex:1"><label for="sc-d">${t("Date")}</label><input class="in" id="sc-d" type="date" dir="ltr" min="${ymd(new Date())}" value="${ymd(d)}"></div><div class="field" style="flex:1"><label for="sc-t">${t("Time")}</label><input class="in" id="sc-t" type="time" dir="ltr" value="${pad(d.getHours())}:${pad(d.getMinutes())}"></div></div>
   <p class="sub" id="sc-prev" style="margin:0 0 12px;font-weight:800;color:var(--teal)">${t("Selected")}: ${fmtDT(d)}</p>
   <div class="err" id="scerr"></div><button class="btn" data-a="saveSchedule" data-v="${el.dataset.v}">${t("Save and mark in progress")}</button>`)},
 saveSchedule:el=>busy(el,async()=>{const d=val("sc-d"),tm=val("sc-t");if(!d||!tm){document.getElementById("scerr").textContent=t("Choose the date and time.");return}
   if(new Date(`${d}T${tm}:00`).getTime()<=Date.now()){document.getElementById("scerr").textContent=t("The visit time has already passed. Choose a later time.");return}
   const at=new Date(`${d}T${tm}:00`);const {error}=await sb.from("requests").update({status:"In progress",scheduled_at:at.toISOString()}).eq("id",el.dataset.v);if(error)throw error;closeSheet();await refresh();toast(t("Visit scheduled. The resident was notified."))}),
 viewNews(el){openDoc(el.dataset.v,"news-files",t("Attachment"))},
 delUpdate:el=>busy(el,async()=>{const up=D.updates.find(x=>x.id===el.dataset.v);await q(sb.from("updates").delete().eq("id",el.dataset.v));if(up?.file_path)try{await sb.storage.from("news-files").remove([up.file_path])}catch(e){}await refresh();toast(t("Update deleted"))}),
 issueViolation:el=>busy(el,async()=>{const u=val("m-vu"),r=val("m-vr"),f=val("m-vf");if(!u||!r)return toast(t("Choose the unit and enter a reason"));
   if(f&&!/^\d+(\.\d+)?$/.test(f))return toast(t("Fine must be a number"));
   await q(sb.from("violations").insert({unit_id:u,reason:r,fine:f?Number(f):null,status:f?"Unpaid":"Open"}));await refresh();toast(t("Violation issued"))}),
 editComm(el){const c=D.communities.find(x=>x.id===el.dataset.v)||{};const f=(id,l,v,ph,mode="tel",hint="")=>`<div class="field"><label for="${id}">${l}</label><input class="in" id="${id}" value="${esc(v||"")}" placeholder="${ph}" ${mode?`inputmode="${mode}" dir="ltr"`:""}>${hint?`<span class="sub" style="font-size:12px;padding:0 4px">${hint}</span>`:""}</div>`;
   sheet(t("Village settings"),`
   <div class="field"><label for="k-d">${t("District")}</label><input class="in" id="k-d" list="k-dl" value="${esc(c.district||"")}" placeholder="${t("e.g. North Coast")}"><datalist id="k-dl">${districts().map(d=>`<option value="${esc(d)}">`).join("")}</datalist></div>
   ${f("k-n",t("Community name"),c.name,t("e.g. Marina Bay Village"),"")}
   ${f("k-wa",t("WhatsApp customer service"),c.whatsapp?"+"+c.whatsapp:"","+20 10 1234 5678","tel",t("With country code, e.g. 201012345678"))}
   ${f("k-cn",t("Contact person (name / title)"),c.contact_name,t("e.g. Mr. Taha — Union president"),"")}
   ${f("k-fb",t("Facebook group link"),c.facebook_url,"https://www.facebook.com/groups/…","url")}
   ${f("k-cc",t("Call center"),c.call_center,"16xxx")}${f("k-s",t("Security gate"),c.security_phone,"010…")}${f("k-o",t("Management office"),c.office_phone,"02…")}${f("k-m",t("Maintenance"),c.maintenance_phone,"011…")}
   <div class="field"><label for="k-bn">${t("Bank")}</label><input class="in" id="k-bn" dir="auto" value="${esc(c.bank_name||"")}"></div>
   <div class="field"><label for="k-ba">${t("Account number")}</label><input class="in" id="k-ba" dir="ltr" value="${esc(c.bank_account||"")}"></div>
   <div class="field"><label for="k-bh">${t("Account holder")}</label><input class="in" id="k-bh" dir="auto" value="${esc(c.bank_holder||"")}"></div>
   <div class="field"><label for="k-g">${t("Community guidelines")}</label><textarea class="in" id="k-g" dir="auto" placeholder="${t("Rules residents should follow")}">${esc(c.guidelines||"")}</textarea></div>
   <div class="err" id="kerr"></div><button class="btn" data-a="saveComm" data-v="${c.id||""}">${c.id?t("Save changes"):t("Add community")}</button>
   `)},
 saveComm:el=>busy(el,async()=>{const wa=val("k-wa")?waNum(val("k-wa")):null;
   const row={district:val("k-d"),name:val("k-n"),whatsapp:wa,contact_name:val("k-cn")||null,facebook_url:val("k-fb")||null,call_center:val("k-cc")||null,security_phone:val("k-s")||null,office_phone:val("k-o")||null,maintenance_phone:val("k-m")||null,guidelines:val("k-g")||null,bank_name:val("k-bn")||null,bank_account:val("k-ba")||null,bank_holder:val("k-bh")||null};
   if(!row.district||!row.name){document.getElementById("kerr").textContent=t("Enter the district and community name.");return}
   if(wa&&!/^\d{8,15}$/.test(wa)){document.getElementById("kerr").textContent=t("With country code, e.g. 201012345678");return}
   if(el.dataset.v)await q(sb.from("communities").update(row).eq("id",el.dataset.v));else await q(sb.from("communities").insert(row));
   closeSheet();await refresh();toast(el.dataset.v?t("Community saved"):t("Community added"))}),
 askDelComm(el){sheet(t("Delete community?"),`<p style="line-height:1.5;margin:0 0 16px">${t("This also removes every unit, request, complaint, pass and update linked to it. This can't be undone.")}</p><button class="btn" style="background:var(--red);box-shadow:none" data-a="delComm" data-v="${el.dataset.v}">${t("Delete community")}</button><div style="height:10px"></div><button class="btn ghost" data-a="closeSheet">${t("Cancel")}</button>`)},
 delComm:el=>busy(el,async()=>{await q(sb.from("communities").delete().eq("id",el.dataset.v));closeSheet();await refresh();toast(t("Community deleted"))}),
};

Object.assign(A,MGR_ACTIONS);
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener("input",e=>{if(e.target.id==="m-q"){const qq=e.target.value.trim().toLowerCase();document.querySelectorAll("#chlist [data-s]").forEach(r=>r.hidden=qq&&!r.dataset.s.includes(qq))}});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState!=="visible"||!D.session||!D.profile)return;
 if(!["home","manager","gate","notifs"].includes(route.name)||document.querySelector("#sheet.on"))return;try{await load();render()}catch(e){}});
setInterval(async()=>{if(document.visibilityState!=="visible"||!D.session||!D.profile||!["home","manager","gate"].includes(route.name)||document.querySelector("#sheet.on,input:focus,textarea:focus"))return;try{await load();render()}catch(e){}},60000);
document.addEventListener("input",e=>{if(e.target.id==="sc-d"||e.target.id==="sc-t"){const p=document.getElementById("sc-prev"),d=val("sc-d"),tm=val("sc-t");if(p&&d&&tm)p.textContent=t("Selected")+": "+fmtDT(new Date(`${d}T${tm}:00`))}});
document.addEventListener("change",e=>{if(e.target.matches("input[type=file][id]")&&document.getElementById(e.target.id+"-n")&&!e.target.dataset.doc){const n=document.getElementById(e.target.id+"-n"),fs=[...(e.target.files||[])];n.textContent=fs.length>1?(LANG==="ar"?arNum(fs.length):fs.length)+" "+t("files"):fs[0]?.name||t("Choose a photo or video");return}if(e.target.id==="rt-id"||e.target.id==="rt-ct"){const n=document.getElementById(e.target.id+"-n");if(n)n.textContent=e.target.files?.[0]?.name||t("Choose a photo or PDF");return}if(e.target.id==="m-pf"){const n=document.getElementById("m-pfn");if(n)n.textContent=e.target.files?.[0]?.name||t("Choose file: newsletter, announcement…");return}if(e.target.matches("input[type=file][data-doc]"))return uploadDoc(e.target);if(e.target.id==="f-district"){tmp.district=e.target.value;tmp.comm="";tmp.unit=val("f-unit");render()}if(e.target.id==="f-comm")tmp.comm=e.target.value});
$("#scrim").addEventListener("click",closeDrawer);$("#scrim2").addEventListener("click",closeSheet);
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&route.name==="welcome")boot()});
const qs=new URLSearchParams(location.search);if(qs.get("error_description"))setTimeout(()=>toast(qs.get("error_description")),400);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
